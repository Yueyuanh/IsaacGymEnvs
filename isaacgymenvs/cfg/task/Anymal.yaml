# used to create the object
name: Anymal

physics_engine: ${..physics_engine}

env:
  numEnvs: ${resolve_default:4096,${...num_envs}}
  envSpacing: 4.  # [m]

  clipObservations: 5.0
  clipActions: 1.0

  plane:
    staticFriction: 1.0  # [-]
    dynamicFriction: 1.0  # [-]
    restitution: 0.        # [-]

  baseInitState:
    pos: [0.0, 0.0, 0.62] # x,y,z [m]
    rot: [0.0, 0.0, 0.0, 1.0] # x,y,z,w [quat]
    vLinear: [0.0, 0.0, 0.0]  # x,y,z [m/s]
    vAngular: [0.0, 0.0, 0.0]  # x,y,z [rad/s]

  randomCommandVelocityRanges:
    linear_x: [-2., 2.] # min max [m/s]
    linear_y: [-1., 1.]   # min max [m/s]
    yaw: [-1., 1.]          # min max [rad/s]

  control:
    # PD Drive parameters:
    stiffness: 85.0  # [N*m/rad]
    damping: 2.0     # [N*m*s/rad]
    actionScale: 0.5
    controlFrequencyInv: 1 # 60 Hz

  defaultJointAngles:  # = target angles when action = 0.0
    LF_HAA: 0.03    # [rad]
    LH_HAA: 0.03    # [rad]
    RF_HAA: -0.03   # [rad]
    RH_HAA: -0.03   # [rad]

    LF_HFE: 0.4     # [rad]
    LH_HFE: -0.4    # [rad]
    RF_HFE: 0.4     # [rad]
    RH_HFE: -0.4    # [rad]

    LF_KFE: -0.8    # [rad]
    LH_KFE: 0.8     # [rad]
    RF_KFE: -0.8    # [rad]
    RH_KFE: 0.8     # [rad]

  urdfAsset:
    collapseFixedJoints: True
    fixBaseLink: False
    defaultDofDriveMode: 4 # see GymDofDriveModeFlags (0 is none, 1 is pos tgt, 2 is vel tgt, 4 effort)

  learn:
    # rewards
    linearVelocityXYRewardScale: 1.0
    angularVelocityZRewardScale: 0.5
    torqueRewardScale: -0.000025 

    # normalization
    linearVelocityScale: 2.0
    angularVelocityScale: 0.25
    dofPositionScale: 1.0
    dofVelocityScale: 0.05

    # episode length in seconds
    episodeLength_s: 50

  # viewer cam:
  viewer:
    refEnv: 0
    pos: [0, 0, 4]  # [m]
    lookat: [1., 1, 3.3]  # [m]

  # set to True if you use camera sensors in the environment
  enableCameraSensors: False

sim:
  dt: 0.02
  substeps: 2
  up_axis: "z"
  use_gpu_pipeline: ${eq:${...pipeline},"gpu"}
  gravity: [0.0, 0.0, -9.81]
  physx:
    num_threads: ${....num_threads}
    solver_type: ${....solver_type}
    use_gpu: ${contains:"cuda",${....sim_device}} # set to False to run on CPU
    num_position_iterations: 4
    num_velocity_iterations: 1
    contact_offset: 0.02
    rest_offset: 0.0
    bounce_threshold_velocity: 0.2
    max_depenetration_velocity: 100.0
    default_buffer_size_multiplier: 5.0
    max_gpu_contact_pairs: 8388608 # 8*1024*1024
    num_subscenes: ${....num_subscenes}
    contact_collection: 1 # 0: CC_NEVER (don't collect contact info), 1: CC_LAST_SUBSTEP (collect only contacts on last substep), 2: CC_ALL_SUBSTEPS (broken - do not use!)

task:
  # 是否启用随机化功能，设置为 False 表示暂时禁用（需要时可打开）
  randomize: False

  # 随机化参数设置
  randomization_params:
    # 随机化的频率：每600个环境步进行一次新的随机化
    frequency: 600

    # 对观测值进行随机扰动
    observations:
      range: [0, .002]           # 添加高斯噪声的幅度范围
      operation: "additive"      # 操作方式：加性噪声
      distribution: "gaussian"   # 分布类型为高斯分布

    # 对动作值添加扰动
    actions:
      range: [0., .02]           # 添加的动作噪声范围
      operation: "additive"      # 加性噪声
      distribution: "gaussian"   # 高斯分布

    # 对仿真参数进行扰动
    sim_params: 
      gravity:
        range: [0, 0.4]          # 重力扰动范围（单位为 m/s²）
        operation: "additive"    # 加性扰动
        distribution: "gaussian" # 使用高斯分布
        schedule: "linear"       # 扰动强度线性递增
        schedule_steps: 3000     # 在前3000步逐渐达到最大扰动值

    # 对机器人或环境中 actor 的参数进行随机化
    actor_params:
      anymal:                    # 这是 actor 的名字，可替换为你环境中的实际名称（如 cartpole）
        color: True              # 是否对颜色进行随机化（增加视觉鲁棒性）

        # 刚体属性（如质量）的扰动
        rigid_body_properties:
          mass: 
            range: [0.5, 1.5]            # 质量缩放范围（50% 到 150%）
            operation: "scaling"         # 缩放扰动方式
            distribution: "uniform"      # 均匀分布采样
            setup_only: True             # 仅在仿真开始前设置一次
            schedule: "linear"           # 线性调度
            schedule_steps: 3000         # 在3000步内逐渐加大扰动

        # 碰撞体属性扰动（如摩擦系数和恢复系数）
        rigid_shape_properties:
          friction:
            num_buckets: 500             # 使用500个 bucket 来均匀采样
            range: [0.7, 1.3]            # 摩擦系数缩放范围
            operation: "scaling"         # 缩放扰动
            distribution: "uniform"      # 均匀分布
            schedule: "linear"
            schedule_steps: 3000

          restitution:
            range: [0., 0.7]             # 恢复系数缩放范围
            operation: "scaling"
            distribution: "uniform"
            schedule: "linear"
            schedule_steps: 3000

        # 关节参数扰动
        dof_properties:
          damping: 
            range: [0.5, 1.5]            # 阻尼系数缩放范围
            operation: "scaling"
            distribution: "uniform"
            schedule: "linear"
            schedule_steps: 3000

          stiffness: 
            range: [0.5, 1.5]            # 刚度系数缩放范围
            operation: "scaling"
            distribution: "uniform"
            schedule: "linear"
            schedule_steps: 3000

          lower:
            range: [0, 0.01]             # 下限加性扰动范围
            operation: "additive"
            distribution: "gaussian"
            schedule: "linear"
            schedule_steps: 3000

          upper:
            range: [0, 0.01]             # 上限加性扰动范围
            operation: "additive"
            distribution: "gaussian"
            schedule: "linear"
            schedule_steps: 3000
